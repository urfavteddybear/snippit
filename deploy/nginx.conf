# Reverse proxy in front of the Snippit app.
# TLS: terminate here (add a 443 server with your certificates) or at an
# upstream proxy/CDN. If an upstream proxy sits in front of this one, configure
# ngx_http_realip_module so $remote_addr is the real client IP.

limit_req_zone  $binary_remote_addr zone=snippit_req:10m  rate=20r/s;
limit_conn_zone $binary_remote_addr zone=snippit_conn:10m;

upstream snippit_app {
    server snippit:8080;
    keepalive 16;
}

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    # Above the app's paste limit so the app returns its own JSON/HTML error.
    client_max_body_size 2m;
    client_body_timeout 15s;
    client_header_timeout 10s;
    send_timeout 30s;

    limit_req  zone=snippit_req burst=40 nodelay;
    limit_conn snippit_conn 30;
    limit_req_status  429;
    limit_conn_status 429;

    location / {
        proxy_pass http://snippit_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        # Overwrite, never append: the app trusts this header for rate limiting.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location = /healthz {
        access_log off;
        proxy_pass http://snippit_app;
    }
}
