# Builds release archives for Linux, macOS and Windows when a v* tag is pushed:
#   git tag v1.0.0 && git push origin v1.0.0
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Test
        run: make test

      - name: Build archives
        run: make dist VERSION=${{ github.ref_name }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/*.tar.gz dist/*.zip dist/SHA256SUMS \
            --title "${{ github.ref_name }}" --generate-notes
