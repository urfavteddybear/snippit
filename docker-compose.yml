# Snippit: single self-contained service.
# Usage: cp .env.example .env && docker compose up -d --build
name: snippit

services:
  snippit:
    build: .
    image: snippit:latest
    restart: unless-stopped
    ports:
      - "${SNIPPIT_PORT:-8080}:8080"
    environment:
      SNIPPIT_BASE_URL: ${SNIPPIT_BASE_URL:-}
      # Only set to true behind a reverse proxy that overwrites X-Real-IP.
      SNIPPIT_TRUST_PROXY: ${SNIPPIT_TRUST_PROXY:-false}
      SNIPPIT_MAX_PASTE_BYTES: ${SNIPPIT_MAX_PASTE_BYTES:-524288}
      SNIPPIT_MAX_TOTAL_BYTES: ${SNIPPIT_MAX_TOTAL_BYTES:-1073741824}
      SNIPPIT_RATE_LIMIT_PER_MINUTE: ${SNIPPIT_RATE_LIMIT_PER_MINUTE:-10}
      SNIPPIT_RATE_LIMIT_BURST: ${SNIPPIT_RATE_LIMIT_BURST:-5}
      SNIPPIT_CLEANUP_INTERVAL: ${SNIPPIT_CLEANUP_INTERVAL:-10m}
      SNIPPIT_GITHUB_URL: ${SNIPPIT_GITHUB_URL:-}
    volumes:
      - snippit-data:/data
    read_only: true
    tmpfs:
      - /tmp # SQLite temp files
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    stop_grace_period: 25s

volumes:
  snippit-data:
